<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<title>單字遠征 Word Quest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,sans-serif;
  background:#080a12;color:#e8ecf5;user-select:none;-webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 15% 0%, rgba(90,70,220,.22), transparent 60%),
    radial-gradient(ellipse 70% 50% at 85% 100%, rgba(200,60,160,.14), transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 50%, rgba(40,90,200,.08), transparent 70%);
}
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#main-ui{flex:1;min-height:0;display:flex;flex-direction:column}
.hidden{display:none!important}

/* ===== 頂部資源列 ===== */
#topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 12px;padding-top:calc(9px + env(safe-area-inset-top));
  background:rgba(12,15,26,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;z-index:10;
}
.brand{font-size:14px;font-weight:800;letter-spacing:.4px;
  background:linear-gradient(135deg,#8b7cff,#00d2ff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.resources{display:flex;gap:6px;align-items:center}
.res{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.06);padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.08)}
.res .ic{font-size:13px}
.icon-btn{
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  color:#c7cce0;font-size:13px;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;font-family:inherit;
}
.icon-btn:active{transform:scale(.88)}
.icon-btn.off{opacity:.4;filter:grayscale(1)}

/* ===== 畫面容器 ===== */
#screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;padding:16px 16px 24px;
  opacity:0;pointer-events:none;transform:translateY(12px);
  transition:opacity .25s ease,transform .25s ease;-webkit-overflow-scrolling:touch}
.screen.active{opacity:1;pointer-events:auto;transform:none}

/* ===== 底部導覽 ===== */
#navbar{display:flex;background:rgba(12,15,26,.92);backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom);z-index:10}
.navbtn{flex:1;padding:9px 4px 7px;text-align:center;font-size:10.5px;color:#6b7391;
  cursor:pointer;transition:color .2s;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.navbtn .ic{font-size:19px;transition:transform .2s}
.navbtn.active{color:#8b7cff}
.navbtn.active .ic{transform:translateY(-2px) scale(1.1);filter:drop-shadow(0 0 10px rgba(139,124,255,.8))}

/* ===== 通用面板 / 按鈕 ===== */
.panel{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:14px;margin-bottom:12px}
.panel-h{font-size:12px;font-weight:700;color:#8b93b0;letter-spacing:1px;margin-bottom:10px}
.big-btn{
  width:100%;padding:16px;border-radius:16px;border:none;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:800;color:#fff;letter-spacing:.5px;
  background:linear-gradient(135deg,#7c5cff,#4a8cff);
  box-shadow:0 8px 24px -6px rgba(110,90,255,.7),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .12s,box-shadow .12s;margin-bottom:10px;
}
.big-btn:active{transform:scale(.97);box-shadow:0 4px 12px -6px rgba(110,90,255,.7)}
.big-btn.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  box-shadow:none;color:#c7cce0;font-size:14px;padding:13px}
.big-btn:disabled{opacity:.4;pointer-events:none}

/* ===== 首頁 ===== */
.hero-panel{text-align:center;padding:24px 0 18px}
.hero-panel h1{font-size:28px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#a89bff,#00d2ff 60%,#ff7ce0);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.hero-panel p{font-size:12.5px;color:#6f7796;letter-spacing:.5px}

#homeCard{display:flex;align-items:center;gap:14px}
#homeCard .hc-sprite{font-size:40px;filter:drop-shadow(0 4px 12px rgba(120,100,255,.6))}
#homeCard .hc-info{flex:1;min-width:0}
#homeCard .hc-word{font-size:21px;font-weight:800;letter-spacing:.5px}
#homeCard .hc-sub{font-size:12px;color:#8b93b0;margin-top:3px}
#homeCard .hc-stats{font-size:11.5px;color:#6f7796;margin-top:4px}

.stage-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
.stage-row b{color:#ffd93d;font-size:17px}
#stageEnemyName{color:#ff8b9c;font-weight:700}

/* ===== 抽卡 ===== */
.gacha-stage{
  min-height:220px;display:flex;flex-wrap:wrap;gap:10px;
  align-items:center;justify-content:center;padding:10px 0;
}
.gcard{
  width:calc(50% - 5px);max-width:160px;
  border-radius:14px;padding:12px 10px;text-align:center;position:relative;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:1.5px solid var(--rc);box-shadow:0 0 22px -6px var(--rc),inset 0 1px 0 rgba(255,255,255,.12);
  animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) backwards;
}
@keyframes cardIn{from{opacity:0;transform:scale(.5) rotateY(90deg)}to{opacity:1;transform:none}}
.gcard-rar{position:absolute;top:7px;left:9px;font-size:9.5px;font-weight:900;color:var(--rc);
  letter-spacing:1px;text-shadow:0 0 8px var(--rc)}
.gcard-word{font-size:17px;font-weight:800;margin-top:14px;letter-spacing:.3px;word-break:break-word}
.gcard-zh{font-size:11.5px;color:#9aa2bd;margin-top:4px}
.gcard-tag{position:absolute;top:6px;right:8px;font-size:9.5px;font-weight:800;
  padding:2px 6px;border-radius:8px}
.tag-new{background:linear-gradient(135deg,#2ed573,#7bed9f);color:#04351a}
.tag-dup{background:rgba(255,217,61,.18);color:#ffd93d;border:1px solid rgba(255,217,61,.4)}
.gacha-hint{text-align:center;font-size:12px;color:#6f7796;margin-bottom:14px}

/* ===== 卡庫 ===== */
#filterBar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.filter-btn{flex-shrink:0;padding:7px 13px;border-radius:20px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);color:#8b93b0;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.filter-btn.active{background:linear-gradient(135deg,rgba(124,92,255,.3),rgba(74,140,255,.3));
  border-color:rgba(139,124,255,.6);color:#c3bcff}
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.wcard{
  position:relative;border-radius:14px;padding:11px 10px 10px;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
  border:1.5px solid var(--rc);transition:transform .12s,box-shadow .2s;
}
.wcard:active{transform:scale(.96)}
.wcard.on{border-color:#ffd93d;box-shadow:0 0 18px -4px rgba(255,217,61,.7)}
.wcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.wcard-rar{font-size:9.5px;font-weight:900;color:var(--rc);letter-spacing:1px}
.wcard-star{font-size:10.5px;color:#ffd93d;letter-spacing:-.5px}
.wcard-word{font-size:16px;font-weight:800;letter-spacing:.3px;word-break:break-word;line-height:1.2}
.wcard-zh{font-size:11.5px;color:#9aa2bd;margin-top:3px}
.wcard-lv{font-size:10px;color:#6f7796;margin-top:6px;font-weight:700}
.wcard-on{position:absolute;bottom:8px;right:9px;font-size:9px;font-weight:800;color:#ffd93d}

/* ===== 彈窗 ===== */
#modal{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;
  justify-content:center;background:rgba(4,6,12,.72);backdrop-filter:blur(6px);
  animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  background:linear-gradient(180deg,#151a2e,#0e1220);
  border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  border:1px solid rgba(255,255,255,.1);border-bottom:none;
  animation:slideUp .3s cubic-bezier(.2,1,.3,1);
}
@keyframes slideUp{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.m-close{position:absolute;top:14px;right:16px;font-size:22px;color:#6f7796;cursor:pointer;line-height:1}
.m-head{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;flex-wrap:wrap}
.m-word{font-size:27px;font-weight:900;letter-spacing:.5px}
.m-pos{font-size:11px;color:#8b93b0;background:rgba(255,255,255,.08);padding:2px 7px;border-radius:6px}
.m-rar{font-size:11px;font-weight:900;padding:2px 8px;border-radius:6px}
.m-tier{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;
  background:rgba(255,217,61,.14);color:#ffd93d;border:1px solid rgba(255,217,61,.3)}
.m-zh{font-size:15px;color:#b9c0d8;margin-top:4px}
.m-stats{display:flex;gap:14px;margin:14px 0 4px;font-size:12.5px;flex-wrap:wrap}
.m-stats span{color:#8b93b0}
.m-stats b{color:#ffd93d}
.m-sec{margin-top:16px}
.m-sec-h{font-size:11.5px;font-weight:800;color:#8b93b0;letter-spacing:1px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center}
.m-sec-h .lock{color:#5a6180;font-weight:600;font-size:10.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:5px 11px;border-radius:9px;font-weight:600;
  background:rgba(139,124,255,.15);border:1px solid rgba(139,124,255,.35);color:#c3bcff}
.chip.lock{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.09);color:#4d5470}
.chip.g{background:rgba(46,213,115,.13);border-color:rgba(46,213,115,.32);color:#7bed9f}
.chip.r{background:rgba(255,71,87,.13);border-color:rgba(255,71,87,.32);color:#ff8b9c}
.m-ex{margin-top:16px;font-size:12.5px;color:#9aa2bd;line-height:1.6;font-style:italic;
  border-left:3px solid rgba(139,124,255,.5);padding-left:11px}
.m-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
.m-btn{padding:13px 8px;border-radius:13px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);color:#e8ecf5;font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;transition:transform .12s;line-height:1.5}
.m-btn:active{transform:scale(.96)}
.m-btn:disabled{opacity:.35}
.m-btn.primary{background:linear-gradient(135deg,#7c5cff,#4a8cff);border:none;
  box-shadow:0 6px 18px -8px rgba(110,90,255,.9)}
.m-btn.full{grid-column:1/-1}
.m-btn small{display:block;font-size:10.5px;font-weight:600;opacity:.75;margin-top:1px}

/* ===== 戰鬥 ===== */
#battle-ui{
  position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0a0d18 0%,#101632 45%,#0a0d18 100%);
  transition:opacity .3s,transform .3s;
}
#battle-ui.closed{opacity:0;pointer-events:none;transform:scale(.97)}
#battleStage{
  flex:1;position:relative;overflow:hidden;display:flex;align-items:center;
  justify-content:space-between;padding:0 7%;min-height:180px;
}
#battleStage::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:45%;
  background:radial-gradient(ellipse 70% 100% at 50% 100%, rgba(90,70,220,.18), transparent 70%);
  pointer-events:none;
}
.fighter{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;z-index:2}
.fighter .sprite{font-size:58px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));
  transition:transform .2s;will-change:transform}
.enemy-f .sprite{font-size:66px}
.nameplate{font-size:11.5px;font-weight:800;letter-spacing:.5px;padding:3px 11px;
  border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.enemy-f .nameplate{color:#ff8b9c;border-color:rgba(255,71,87,.35);background:rgba(255,71,87,.12)}
.hero-f .nameplate{color:#8bddff;border-color:rgba(0,210,255,.35);background:rgba(0,210,255,.1)}
.hpb{width:96px;height:9px;background:rgba(0,0,0,.55);border-radius:5px;overflow:hidden;
  border:1px solid rgba(255,255,255,.12)}
.hpf{height:100%;border-radius:5px;transition:width .35s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,#2ed573,#7bed9f)}
.enemy-f .hpf{background:linear-gradient(90deg,#ff4757,#ff8b9c)}
.hpnum{font-size:10px;color:#8b93b0;font-weight:700}

.hero-f.attacking{animation:heroAtk .55s cubic-bezier(.3,0,.3,1)}
@keyframes heroAtk{
  0%{transform:translateX(0) scale(1)}
  18%{transform:translateX(-14px) scale(.94)}
  45%{transform:translateX(165px) scale(1.1)}
  58%{transform:translateX(165px) scale(1.1)}
  100%{transform:translateX(0) scale(1)}
}
.enemy-f.attacking{animation:enemyAtk .55s cubic-bezier(.3,0,.3,1)}
@keyframes enemyAtk{
  0%{transform:translateX(0) scale(1)}
  18%{transform:translateX(14px) scale(1.06)}
  45%{transform:translateX(-150px) scale(1.14)}
  58%{transform:translateX(-150px) scale(1.14)}
  100%{transform:translateX(0) scale(1)}
}
.enemy-f.hit{animation:hitFlash .22s}
.hero-f.hurt{animation:hurtFlash .32s}
@keyframes hitFlash{
  0%,100%{filter:none}
  50%{filter:brightness(3) saturate(0) drop-shadow(0 0 20px #fff)}
}
@keyframes hurtFlash{
  0%,100%{filter:none;transform:translateX(0)}
  30%{filter:brightness(2) sepia(1) hue-rotate(-40deg);transform:translateX(-16px)}
  70%{filter:brightness(2) sepia(1) hue-rotate(-40deg);transform:translateX(-8px)}
}
.shake{animation:shakeAnim .32s}
@keyframes shakeAnim{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-7px,4px)}
  35%{transform:translate(6px,-5px)}
  55%{transform:translate(-5px,-3px)}
  75%{transform:translate(4px,4px)}
}

#fxLayer{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.dmg{position:absolute;font-size:24px;font-weight:900;color:#fff;
  text-shadow:0 0 12px #6c5ce7,0 2px 4px rgba(0,0,0,.8);
  animation:dmgFloat .85s cubic-bezier(.2,1,.4,1) forwards;transform:translate(-50%,-50%);white-space:nowrap}
.dmg.crit{font-size:34px;color:#ffd93d;text-shadow:0 0 20px #ff9500,0 2px 6px rgba(0,0,0,.8)}
.dmg.heal{color:#ff6b81;text-shadow:0 0 12px #ff4757}
@keyframes dmgFloat{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  25%{opacity:1;transform:translate(-50%,-90%) scale(1.25)}
  50%{transform:translate(-50%,-110%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-190%) scale(.9)}
}
.particle{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;
  box-shadow:0 0 12px #8b7cff,0 0 22px #4a8cff;
  animation:particleFly .65s cubic-bezier(.1,.8,.3,1) forwards;transform:translate(-50%,-50%)}
@keyframes particleFly{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2)}
}
.redflash{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(255,40,60,.55));
  animation:fadeOut .42s forwards}
@keyframes fadeOut{to{opacity:0}}

#battleBottom{
  flex-shrink:0;padding:14px 15px calc(16px + env(safe-area-inset-bottom));
  background:rgba(9,12,22,.95);backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,.08);border-radius:22px 22px 0 0;
}
#comboWrap{height:0;overflow:visible;position:relative}
#comboDisplay{
  position:absolute;top:-34px;left:50%;transform:translateX(-50%);
  font-size:13px;font-weight:900;letter-spacing:1.5px;color:#ffd93d;
  text-shadow:0 0 16px rgba(255,217,61,.9);white-space:nowrap;
  animation:comboPop .3s cubic-bezier(.2,1.6,.4,1);
}
@keyframes comboPop{from{transform:translateX(-50%) scale(.5);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#questionText{font-size:16px;font-weight:700;text-align:center;line-height:1.5;min-height:24px}
#questionText b{color:#8bddff;font-size:19px;letter-spacing:.5px}
#options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{
  padding:13px 8px;border-radius:13px;border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.055);color:#e8ecf5;font-family:inherit;
  font-size:14.5px;font-weight:700;cursor:pointer;transition:all .14s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.opt:active{transform:scale(.95);background:rgba(255,255,255,.14)}
.opt.correct{background:rgba(46,213,115,.22);border-color:#2ed573;color:#7bed9f;
  box-shadow:0 0 22px -4px rgba(46,213,115,.8)}
.opt.wrong{background:rgba(255,71,87,.22);border-color:#ff4757;color:#ff8b9c;animation:shakeX .32s}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt.disabled{pointer-events:none;opacity:.5}
#timerWrap{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:12px;overflow:hidden}
#timerBar{height:100%;width:100%;border-radius:3px;
  background:linear-gradient(90deg,#7c6cff,#00d2ff)}

/* ===== 戰鬥結算 ===== */
#battleResult{position:absolute;inset:0;z-index:50;display:flex;align-items:center;
  justify-content:center;background:rgba(4,6,12,.85);backdrop-filter:blur(8px);
  animation:fadeIn .3s}
.result-box{text-align:center;padding:32px 28px;width:88%;max-width:340px;
  background:linear-gradient(180deg,#1a2038,#0f1424);border-radius:24px;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 60px -20px rgba(0,0,0,.9);animation:slideUp .35s cubic-bezier(.2,1,.3,1)}
.result-title{font-size:32px;font-weight:900;letter-spacing:3px;margin-bottom:8px}
.result-title.win{background:linear-gradient(135deg,#ffd93d,#ff9500);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,180,0,.5))}
.result-title.lose{color:#ff6b81;filter:drop-shadow(0 0 20px rgba(255,71,87,.4))}
.result-sub{font-size:12.5px;color:#8b93b0;margin-bottom:18px}
.result-rewards{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.reward-row{display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.05);padding:11px 15px;border-radius:12px;font-size:14px}
.reward-row b{color:#ffd93d;font-size:16px}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:20%;transform:translate(-50%,20px);
  background:rgba(20,24,40,.96);border:1px solid rgba(255,255,255,.14);
  color:#e8ecf5;padding:11px 22px;border-radius:24px;font-size:13.5px;font-weight:700;
  z-index:500;opacity:0;transition:all .3s cubic-bezier(.2,1,.3,1);
  pointer-events:none;backdrop-filter:blur(10px);box-shadow:0 10px 30px -10px rgba(0,0,0,.8)}
.toast.show{opacity:1;transform:translate(-50%,0)}

::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>

<div id="app">

  <div id="main-ui">
    <header id="topbar">
      <div class="brand">⚔️ 單字遠征</div>
      <div class="resources">
        <div class="res"><span class="ic">💰</span><span id="goldVal">0</span></div>

function noteFreq(name){
  const map = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
  const m = /^([A-G]#?)(\d)$/.exec(name);
  if(!m) return 440;
  const midi = (parseInt(m[2])+1)*12 + map[m[1]];
  return 440 * Math.pow(2, (midi-69)/12);
}

/* ---- 音樂播放器（lookahead 調度） ---- */
class MusicPlayer{
  constructor(){
    this.ctx=null; this.gain=null; this.timer=null;
    this.step=0; this.nextTime=0; this.track=null; this.trackName=null;
    this.secPerStep=0;
  }
  attach(ctx, gain){ this.ctx=ctx; this.gain=gain; }
  play(name){
    if(!this.ctx) return;
    if(this.trackName===name && this.timer) return;
    this.stop();
    const t = TRACKS[name];
    if(!t) return;
    this.track=t; this.trackName=name; this.step=0;
    this.secPerStep = 60 / t.bpm / (t.stepsPerBeat||2);
    this.nextTime = this.ctx.currentTime + 0.08;
    this.timer = setInterval(()=>this.tick(), 25);
    this.tick();
  }
  stop(){
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    this.trackName=null;
  }
  tick(){
    if(!this.ctx||!this.track) return;
    const now = this.ctx.currentTime;
    if(this.nextTime < now - 0.5) this.nextTime = now + 0.05;  // 後台切回時重新對齊
    while(this.nextTime < now + 0.15){
      this.scheduleStep(this.step, this.nextTime);
      this.nextTime += this.secPerStep;
      this.step++;
    }
  }
  scheduleStep(step, time){
    const t = this.track;
    const SPC = 8;
    const total = t.chords.length * SPC;
    const s = step % total;
    const chord = t.chords[Math.floor(s / SPC)];
    const pos = s % SPC;
    if(pos===0 || pos===4){
      this.playNote(chord.bass, time, this.secPerStep*3.2, t.bassVol, t.bassType);
    }
    if(chord.arp[pos]){
      this.playNote(chord.arp[pos], time, this.secPerStep*0.85, t.arpVol, t.arpType);
    }
  }
  playNote(name, time, dur, vol, type){
    try{
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type||'sine';
      osc.frequency.value = noteFreq(name);
      osc.connect(g); g.connect(this.gain);
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(vol, time + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.start(time);
      osc.stop(time + dur + 0.05);
    }catch(e){}
  }
}

/* ---- 音訊總管 ---- */
const AudioSys = {
  ctx:null, master:null, sfxGain:null, musicGain:null,
  music:null, ready:false,
  musicEnabled:true, sfxEnabled:true,

  init(){
    if(this.ctx) return;
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);

      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.85;
      this.sfxGain.connect(this.master);

      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.4;
      this.musicGain.connect(this.master);

      this.music = new MusicPlayer();
      this.music.attach(this.ctx, this.musicGain);
      this.ready = true;
    }catch(e){ this.ready = false; }
  },

  resume(){
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  sfx(freq, dur, type, vol, slideTo){
    if(!this.ready || !this.sfxEnabled) return;
    this.resume();
    try{
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type || 'sine';
      o.connect(g); g.connect(this.sfxGain);
      const t = this.ctx.currentTime;
      o.frequency.setValueAtTime(freq, t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.1, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.03);
    }catch(e){}
  },

  playMusic(name){
    if(!this.ready || !this.musicEnabled) return;
    this.resume();
    this.music.play(name);
  },

  stopMusic(){ if(this.music) this.music.stop(); },
};

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function toast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),320);},1500);
}

      const d = JSON.parse(raw);
      state = Object.assign(DEFAULT_STATE(), d);
    }
  }catch(e){ state = DEFAULT_STATE(); }
  if(state.music === undefined) state.music = true;
  if(state.sfx   === undefined) state.sfx   = true;
}
function sanitizeCards(){
  const valid = new Set(WORDS.map(x=>x.w));
  Object.keys(state.cards).forEach(id=>{
    if(!valid.has(id)) delete state.cards[id];
  });
  if(!Object.keys(state.cards).length){
    state.cards = { office:{lv:1,star:1}, meeting:{lv:1,star:1}, available:{lv:1,star:1} };
  }
  if(!state.team || !state.cards[state.team]){
    state.team = Object.keys(state.cards)[0];
  }
}

/* =========================================================
   6. 卡牌數值
   ========================================================= */
const MAX_LV = 10, MAX_STAR = 5;

function wordOf(id){ return WORDS.find(x=>x.w===id); }

function formsUnlocked(card, lv){
  if(lv>=7) return 3;
  if(lv>=5) return 2;
  if(lv>=3) return 1;
  return 0;
}
function countUnlocked(w, c){
  let n = Math.min(formsUnlocked(w, c.lv), (w.forms||[]).length);
  if(c.star>=2) n += (w.syn||[]).length;
  if(c.star>=3) n += (w.ant||[]).length;
  return n;
}
function cardStats(w){
  const c = state.cards[w.w];
  if(!c) return null;
  const base = RARITY[w.rar];
  const unlocked = countUnlocked(w, c);
  const atk = Math.round(
    base.atk * (1 + 0.12*(c.lv-1)) * (1 + 0.22*(c.star-1)) * (1 + 0.05*unlocked)
  );
  const hp = Math.round(
    base.hp * (1 + 0.10*(c.lv-1)) * (1 + 0.18*(c.star-1))
  );
  return { atk, hp };
}
function lvCost(lv){ return 20 + 15*(lv-1); }
function starCost(star){ return [0,3,6,10,15][star] || 999; }

function rollCard(){
  const r = Math.random();
  let rar;
  if(r < 0.62) rar = 1;
  else if(r < 0.92) rar = 2;
  else rar = 3;
  const pool = WORDS.filter(x=>x.rar===rar);
  return pick(pool);
}

function doDraw(count){
  const cost = count * 60;
  if(state.gold < cost){ toast('金幣不足，去戰鬥賺錢吧！'); S.wrong(); return; }
  state.gold -= cost;

  const results = [];
  let gotRare = false;

  for(let i=0;i<count;i++){
    const w = rollCard();
    const isNew = !state.cards[w.w];
    if(isNew){
      state.cards[w.w] = { lv:1, star:1 };
      if(!state.team) state.team = w.w;
    }else{
      state.dust += 3;
    }
    if(w.rar===3) gotRare = true;
    results.push({ w, isNew });
  }

  const host = $('#gachaResult');
  host.innerHTML = results.map((r,i)=>{
    const rc = RARITY[r.w.rar].c;
    return `<div class="gcard" style="--rc:${rc};animation-delay:${i*0.07}s">
      <div class="gcard-rar">${RARITY[r.w.rar].n}</div>
      <span class="gcard-tag ${r.isNew?'tag-new':'tag-dup'}">${r.isNew?'NEW':'+3✨'}</span>
      <div class="gcard-word" style="color:${rc}">${r.w.w}</div>
      <div class="gcard-zh">${r.w.zh}</div>
    </div>`;
  }).join('');

  if(gotRare) S.rare(); else S.draw();

  updateTopbar(); renderHome(); renderCards(); save();
}

/* ---- 出題 ---- */
function allEnglishPool(){
  const s = new Set();
  WORDS.forEach(w=>{
    (w.syn||[]).forEach(x=>s.add(x));
    (w.ant||[]).forEach(x=>s.add(x));
  });
  return [...s];
}
function pickDistractors(excludeSet, n, pool){
  const uniq = [...new Set(pool)];
  const cands = shuffle(uniq.filter(x=>!excludeSet.has(String(x).toLowerCase())));
  const out = [];
  for(const c of cands){
    if(out.length>=n) break;
    if(!out.includes(c)) out.push(c);
  }
  return out;
}

function generateQuestion(){
  const ids = Object.keys(state.cards);
  const id  = pick(ids);
  const w   = wordOf(id);
  const c   = state.cards[id];

  const roll = Math.random();
  let type = 'meaning';
  if(roll < 0.20 && c.star>=2 && (w.syn||[]).length) type = 'syn';
  else if(roll < 0.40 && c.star>=3 && (w.ant||[]).length) type = 'ant';

  let text, correct, options, mult;

  if(type === 'meaning'){
    text = `「<b>${w.w}</b>」是什麼意思？`;
    correct = w.zh;
    mult = 1.0;
    const pool = WORDS.filter(x=>x.zh!==w.zh).map(x=>x.zh);
    const dis = pickDistractors(new Set([w.zh]), 3, pool);
    options = shuffle([correct, ...dis]);
  }
  else if(type === 'syn'){
    text = `「<b>${w.w}</b>」的近義詞是？`;
    correct = pick(w.syn);
    mult = 1.5;
    const excl = new Set([...w.syn, ...(w.ant||[]), w.w].map(s=>s.toLowerCase()));
    const dis = pickDistractors(excl, 3, allEnglishPool());
    options = shuffle([correct, ...dis]);
  }
  else{
    text = `「<b>${w.w}</b>」的反義詞是？`;
    correct = pick(w.ant);
    mult = 1.5;
    const excl = new Set([...w.syn, ...(w.ant||[]), w.w].map(s=>s.toLowerCase()));
    const dis = pickDistractors(excl, 3, allEnglishPool());
    options = shuffle([correct, ...dis]);
  }

  options = [...new Set(options)];
  while(options.length < 4){
    const extra = pick(WORDS).zh;
    if(!options.includes(extra)) options.push(extra);
  }

  return { text, options, correctIndex: options.indexOf(correct), mult, type, word:w };
}

function nextQuestion(){
  if(!battle || battle.over) return;
  battle.busy = false;
  clearTimeout(qTimer);

  const q = generateQuestion();
  battle.currentQ = q;

  $('#questionText').innerHTML = q.text;

  const optEl = $('#options');
  optEl.innerHTML = '';
  q.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = ()=> answer(i, btn);
    optEl.appendChild(btn);
  });

  const bar = $('#timerBar');
  bar.style.transition = 'none';
  bar.style.width = '100%';
  void bar.offsetWidth;
  requestAnimationFrame(()=>{
    bar.style.transition = `width ${Q_TIME}ms linear`;
    bar.style.width = '0%';
  });

  battle.qStart = Date.now();
  qTimer = setTimeout(()=> answer(-1, null), Q_TIME);
}

function answer(idx, btn){
  if(!battle || battle.busy || battle.over) return;
  battle.busy = true;
  clearTimeout(qTimer);

  const bar = $('#timerBar');
  bar.style.transition = 'none';

  const q = battle.currentQ;
  const correct = idx === q.correctIndex;

  $$('#options .opt').forEach(b=>b.classList.add('disabled'));

  if(correct){
    btn.classList.add('correct');
    S.correct();

    const elapsed = Date.now() - battle.qStart;
    const speed   = clamp(1 - elapsed/Q_TIME, 0, 1);

    let dmg = battle.heroAtk;
    dmg *= (1 + Math.min(battle.combo,10) * 0.12);
    dmg *= (1 + speed * 0.6);
    dmg *= q.mult;
    const crit = Math.random() < 0.12;
    if(crit) dmg *= 2;
    dmg = Math.max(1, Math.round(dmg));

    battle.combo++;
    updateCombo();

    doHeroAttack(dmg, crit);
  }else{
    if(btn) btn.classList.add('wrong');
    const opts = $$('#options .opt');
    if(opts[q.correctIndex]) opts[q.correctIndex].classList.add('correct');
    S.wrong();

    battle.combo = 0;
    updateCombo();

    setTimeout(doEnemyAttack, 420);
  }
}

function doHeroAttack(dmg, crit){
  const heroF  = $('#heroF');
  const enemyF = $('#enemyF');

  heroF.classList.remove('attacking');
  void heroF.offsetWidth;
  heroF.classList.add('attacking');

  setTimeout(()=>{
    spawnBurst(enemyF);
    spawnDamage(enemyF, dmg, crit ? 'crit' : '');
    shake();
    crit ? S.crit() : S.hit();

    enemyF.classList.add('hit');
    setTimeout(()=> enemyF.classList.remove('hit'), 220);

    battle.enemyHp -= dmg;
    updateBars();

    if(battle.enemyHp <= 0){
      setTimeout(winBattle, 420);
    }else{
      setTimeout(()=>{
        heroF.classList.remove('attacking');
        nextQuestion();
      }, 340);
    }
  }, 245);
}

function doEnemyAttack(){
  if(!battle || battle.over) return;
  const heroF  = $('#heroF');
  const enemyF = $('#enemyF');

  enemyF.classList.remove('attacking');
  void enemyF.offsetWidth;
  enemyF.classList.add('attacking');

  setTimeout(()=>{
    const dmg = battle.enemyAtk;
    battle.heroHp -= dmg;
    updateBars();
    S.hit();
    flashRed();
    shake();
    spawnDamage(heroF, dmg, 'heal');

    heroF.classList.add('hurt');
    setTimeout(()=> heroF.classList.remove('hurt'), 340);

    if(battle.heroHp <= 0){
      setTimeout(loseBattle, 420);
    }else{
      setTimeout(()=>{
        enemyF.classList.remove('attacking');
        if(battle) nextQuestion();
      }, 380);
    }
  }, 245);
}

function spawnDamage(target, val, cls){
  const layer = $('#fxLayer');
  const tr = target.getBoundingClientRect();
  const sr = $('#battleStage').getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'dmg ' + cls;
  d.textContent = (cls==='heal' ? '-' : '') + val;
  d.style.left = (tr.left - sr.left + tr.width/2) + 'px';
  d.style.top  = (tr.top  - sr.top  + tr.height*0.35) + 'px';
  layer.appendChild(d);
  setTimeout(()=> d.remove(), 900);
}

function spawnBurst(target){
  const layer = $('#fxLayer');
  const tr = target.getBoundingClientRect();
  const sr = $('#battleStage').getBoundingClientRect();
  const cx = tr.left - sr.left + tr.width/2;
  const cy = tr.top  - sr.top  + tr.height/2;
  for(let i=0;i<10;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = cx + 'px';
    p.style.top  = cy + 'px';
    const ang = Math.random()*Math.PI*2;
    const dist = 35 + Math.random()*70;
    p.style.setProperty('--dx', (Math.cos(ang)*dist).toFixed(1)+'px');
    p.style.setProperty('--dy', (Math.sin(ang)*dist).toFixed(1)+'px');
    layer.appendChild(p);
    setTimeout(()=> p.remove(), 700);
  }
}

function shake(){
  const s = $('#battleStage');
  s.classList.remove('shake');
  void s.offsetWidth;
  s.classList.add('shake');
  setTimeout(()=> s.classList.remove('shake'), 340);
}

function flashRed(){
  const f = document.createElement('div');
  f.className = 'redflash';
  $('#battleStage').appendChild(f);
  setTimeout(()=> f.remove(), 450);
}

function winBattle(){
  if(!battle || battle.over) return;
  battle.over = true;
  clearTimeout(qTimer);
  S.win();

  const goldGain = 40 + state.stage*20;
  state.gold += goldGain;
  const nextStage = state.stage + 1;

  showResult(true, goldGain, nextStage);
  updateTopbar(); save();
}

function loseBattle(){
  if(!battle || battle.over) return;
  battle.over = true;
  clearTimeout(qTimer);
  S.lose();

  showResult(false, 0, state.stage);
  updateTopbar(); save();
}

function showResult(win, gold, nextStage){
  const box = $('#battleResult');
  box.classList.remove('hidden');
  box.innerHTML = `
    <div class="result-box">
      <div class="result-title ${win?'win':'lose'}">${win?'勝 利':'敗 北'}</div>
      <div class="result-sub">${win?'知識就是力量！':'別灰心，單字會越記越牢的'}</div>
      <div class="result-rewards">
        ${win
          ? `<div class="reward-row"><span>💰 金幣</span><b>+${gold}</b></div>
             <div class="reward-row"><span>🎯 下一關</span><b>第 ${nextStage} 關</b></div>`
          : `<div class="reward-row"><span>💡 提示</span><b>答對越快傷害越高</b></div>
             <div class="reward-row"><span>⚔️ 建議</span><b>升級卡牌再挑戰</b></div>`}
      </div>
      <button class="big-btn" id="resultBtn">${win?'繼續前進':'返回主頁'}</button>
    </div>`;

  $('#resultBtn').onclick = ()=>{
    S.click();
    if(win){
      state.stage = nextStage;
      save();
      box.classList.add('hidden');
      $('#battle-ui').classList.add('closed');
      renderAll();
      AudioSys.playMusic('home');
      toast(`抵達第 ${nextStage} 關！`);
    }else{
      box.classList.add('hidden');
      $('#battle-ui').classList.add('closed');
      renderAll();
      AudioSys.playMusic('home');
    }
  };
}

/* =========================================================
   11. 導覽 & 初始化
   ========================================================= */
function switchScreen(name){
  currentScreen = name;
  $$('.screen').forEach(s=>s.classList.toggle('active', s.id === 'screen-'+name));
  $$('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.screen === name));
  if(name === 'cards') renderCards();
  if(name === 'home')  renderHome();
  // 依畫面切換背景音樂
  if(name === 'gacha') AudioSys.playMusic('gacha');
  else                  AudioSys.playMusic('home');
}

/* ---- 首次互動啟動音訊（瀏覽器自動播放限制） ---- */
let audioBooted = false;
function bootAudio(){
  if(audioBooted) return;
  audioBooted = true;
  AudioSys.init();
  AudioSys.musicEnabled = state.music;
  AudioSys.sfxEnabled   = state.sfx;
  AudioSys.resume();
  S.boot();
  if(state.music){
    setTimeout(()=>{
      if(currentScreen === 'gacha') AudioSys.playMusic('gacha');
      else AudioSys.playMusic('home');
    }, 140);
  }
}

function init(){
  load();
  sanitizeCards();

  // 導覽
  $$('.navbtn').forEach(btn=>{
    btn.onclick = ()=>{ S.click(); switchScreen(btn.dataset.screen); };
  });

  // 卡庫篩選
  $$('.filter-btn').forEach(btn=>{
    btn.onclick = ()=>{
      S.click();
      $$('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      cardFilter = btn.dataset.rar;
      renderCards();
    };
  });

  // 首頁
  $('#startBattleBtn').onclick = ()=>{ S.click(); startBattle(); };

  // 抽卡
  $('#drawBtn').onclick    = ()=>{ S.click(); doDraw(1); };
  $('#drawTenBtn').onclick = ()=>{ S.click(); doDraw(10); };

  // 音樂 / 音效開關
  $('#musicBtn').onclick = ()=>{
    state.music = !state.music;
    AudioSys.musicEnabled = state.music;
    if(state.music){
      AudioSys.resume();
      AudioSys.playMusic(currentScreen === 'gacha' ? 'gacha' : 'home');
    }else{
      AudioSys.stopMusic();
    }
    save(); updateAudioBtns();
  };
  $('#sfxBtn').onclick = ()=>{
    state.sfx = !state.sfx;
    AudioSys.sfxEnabled = state.sfx;
    if(state.sfx) S.click();
    save(); updateAudioBtns();
  };

  renderAll();

  // 第一次點擊/觸控時啟動音訊
  document.addEventListener('touchstart', bootAudio, {once:true, passive:true});
  document.addEventListener('click',      bootAudio, {once:true});
}

init();
</script>
